services:
  backend:
    build:
      context: ./back-server
    ports:
      - "3008:3008"
    volumes:
      - ./back-server:/app
      - /app/node_modules
    env_file:
      - ./front-server/.env.development
    environment:
      - NODE_ENV=development
    depends_on:
      - cmsdatabase
      - toherodb
    networks:
      - cms-network

  frontend:
    build:
      context: ./front-server
      dockerfile: Dockerfile.dev  # ← Utilise Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - ./front-server:/app
      - /app/node_modules
    networks:
      - cms-network

  cmsdatabase:
    image: postgres:17
    container_name: numdiagcmsdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: numdiagcmsdb
    ports:
      - "5436:5432"
    volumes:
      - numdiagcms-data:/var/lib/postgresql/data
    networks:
      - cms-network

  toherodb:
    image: postgres:17
    container_name: toherodb-cms-container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: toherocmsdb
    ports:
      - "5437:5432"
    volumes:
      - toherocms-data:/var/lib/postgresql/data
    user: postgres
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  numdiagcms-data:
  toherocms-data:
